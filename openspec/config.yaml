schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Tech stack: TypeScript, Node.js, Express, tsx (dev runner), vitest (tests)
  Language: TypeScript strict mode, ESM modules
  Conventions: kebab-case filenames, camelCase identifiers
  Testing: vitest with supertest for API tests
  Domain: AI agent workflow orchestration (Superpowers + OpenSpec + MemPalace)
  Repo size: ~20 source files — use native search (ripgrep/glob), no RAG needed

# Per-operation guidance
operations:
  apply:
    guidance:
      - Run `npx tsx --test tests/*.test.ts` after each completed task to verify
  archive:
    guidance:
      - After archiving, call mempalace_kg_add to record the decision (subject=change-name, predicate=archived, object=target-name)
      - Call mempalace_diary_write to log the session outcome in AAAK format
